# Version updates are monthly and grouped into one PR per ecosystem.
# Security updates are separate and run whenever an advisory is published.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  target-branch: dev
  schedule:
    interval: monthly
  groups:
    all:
      patterns:
      - '*'
  ignore:
  - dependency-name: a2a-lf
  - dependency-name: a2a-pb
  - dependency-name: arc-swap
  - dependency-name: async-trait
  - dependency-name: axum
  - dependency-name: base64
  - dependency-name: bumpalo
  - dependency-name: bytes
  - dependency-name: core_affinity
  - dependency-name: crc32fast
  - dependency-name: criterion
  - dependency-name: dimpl
  - dependency-name: ed25519-dalek
  - dependency-name: flate2
  - dependency-name: futures
  - dependency-name: getrandom
  - dependency-name: h2
  - dependency-name: hex
  - dependency-name: hmac
  - dependency-name: http
  - dependency-name: http-body
  - dependency-name: http-body-util
  - dependency-name: httpdate
  - dependency-name: hyper
  - dependency-name: hyper-rustls
  - dependency-name: hyper-util
  - dependency-name: indexmap
  - dependency-name: jsonschema
  - dependency-name: ldap3
  - dependency-name: libc
  - dependency-name: libloading
  - dependency-name: log
  - dependency-name: loom
  - dependency-name: memchr
  - dependency-name: metrics
  - dependency-name: metrics-exporter-prometheus
  - dependency-name: metrics-util
  - dependency-name: mysql
  - dependency-name: oauth-as
  - dependency-name: opentelemetry-proto
  - dependency-name: postgres
  - dependency-name: proc-macro2
  - dependency-name: proptest
  - dependency-name: prost
  - dependency-name: rcgen
  - dependency-name: redis
  - dependency-name: reqwest
  - dependency-name: ring
  - dependency-name: rmcp
  - dependency-name: rusqlite
  - dependency-name: rustls
  - dependency-name: rustls-pki-types
  - dependency-name: schemars
  - dependency-name: serde
  - dependency-name: serde_json
  - dependency-name: serde_urlencoded
  - dependency-name: serde_yaml
  - dependency-name: sha2
  - dependency-name: smallvec
  - dependency-name: socket2
  - dependency-name: sonic-rs
  - dependency-name: syn
  - dependency-name: tar
  - dependency-name: tikv-jemalloc-ctl
  - dependency-name: tikv-jemallocator
  - dependency-name: tokio
  - dependency-name: tokio-rustls
  - dependency-name: tokio-tungstenite
  - dependency-name: tokio-util
  - dependency-name: tonic
  - dependency-name: tonic-types
  - dependency-name: tower
  - dependency-name: tracing
  - dependency-name: tracing-core
  - dependency-name: tracing-log
  - dependency-name: tracing-subscriber
  - dependency-name: tungstenite
  - dependency-name: ulid
  - dependency-name: url
  - dependency-name: webpki
  - dependency-name: webpki-roots
  - dependency-name: zeroize
