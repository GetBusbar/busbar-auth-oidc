# RENDERED by `busbar-release plugin heal busbar-auth-oidc` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. On a v* tag: this repo's own ci.yml (the fleet harness) on the
# tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then the consumer
# verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

# Nothing by default: each job below is granted exactly what the workflow it calls needs, and is
# passed only the secrets that workflow declares (never every secret wholesale).
permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # No secrets: the tagged commit's CI needs none (coverage upload skips without CODECOV_TOKEN).
  release:
    needs: ci
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@e171ea95260a76ba3cd7156dab480fe4cae60747
    with:
      plugin_crate: busbar-auth-oidc-plugin
      manifest_name: busbar-auth-oidc
      plugin_alias: oidc
      plugin_kind: auth
      asset_prefix: busbar-auth-oidc
      description: "The OIDC auth module as a droppable busbar plugin: a cdylib exporting the auth C ABI. Drop it in the plugins folder and add oidc to auth.chain with its settings nested under it."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "auth-oidc/declares.json"
      former_names: "busbar-auth-oidc-plugin"
    secrets:
      BUSBAR_SIGN_KEY: ${{ secrets.BUSBAR_SIGN_KEY }}
      RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@e171ea95260a76ba3cd7156dab480fe4cae60747
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-auth-oidc
      plugin_name: busbar-auth-oidc
      plugin_alias: oidc
      plugin_kind: auth
      bundle_image: ""
      bundle_env: ""
