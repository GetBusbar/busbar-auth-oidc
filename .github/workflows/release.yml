# RENDERED by `cargo xtask fleet render busbar-auth-oidc` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. On a v* tag: this
# repo's CI on the tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then
# the consumer verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    tags: ["v*", "!v*-*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@7a5b429041752e00375e120ab1547a8928c3dee4
    with:
      service: none
      busbar_checkout: true
      macos_test: "cargo test --workspace --locked --lib --test conformance"
      extra_test: ""
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@7a5b429041752e00375e120ab1547a8928c3dee4
    with:
      plugin_crate: busbar-auth-oidc-plugin
      manifest_name: busbar-auth-oidc-plugin
      plugin_alias: oidc
      plugin_kind: auth
      asset_prefix: busbar-auth-oidc-plugin
      description: "The OIDC auth module as a droppable busbar plugin: a cdylib exporting the auth C ABI. Drop it in the plugins folder and add oidc to auth.chain with its settings nested under it."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "auth-oidc/declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@7a5b429041752e00375e120ab1547a8928c3dee4
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-auth-oidc-plugin
      plugin_name: busbar-auth-oidc-plugin
      plugin_alias: oidc
      plugin_kind: auth
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
