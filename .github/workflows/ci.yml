# RENDERED by `cargo xtask fleet render busbar-auth-oidc` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. The CI itself is
# busbar's plugin-ci.yml, taken at the busbar commit this repo pins (.busbar-ref).
name: ci

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@e1d3d8b097201859751d77208e66249d98b50a4b
    with:
      service: none
      busbar_checkout: true
      macos_test: "cargo test --workspace --locked --lib --test conformance"
      extra_test: ""
      plugin_crate: busbar-auth-oidc-plugin
      plugin_kind: auth
      plugin_alias: oidc
    secrets: inherit
