# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-oidc"
version = "1.0.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The OIDC auth module for busbar: verify an OpenID Connect JWT (JWKS signature + iss/aud/exp/nbf) and map its role/group claim to a Principal. Its door is the auth kind's memory-ABI door (verify and browser login). Crypto on ring (no jsonwebtoken/rsa)."
license = "Apache-2.0"

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only). Pinned by git rev to the busbar commit in
# `.busbar-ref`; a busbar build that links this crate `[patch]`es the busbar git source to its own
# tree, so ONE copy of the contract links.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Signature verification on the workspace's existing crypto backend — NO jsonwebtoken/rsa (avoids
# RUSTSEC-2023-0071 and a second crypto stack). ring is already in the graph (rustls' backend).
ring = "0.17"
# base64url for the JWT segments and JWKS key material; already in the graph.
base64 = "0.22"
# NO HTTP CLIENT, NO TLS, NO SOCKET: discovery, the JWKS and the login's token exchange go out
# through the host's connector as declared needs (THE DESIGN 5, Connections; the fleet `[net-ban]`).
# `url` parses the URLs the module is configured with or discovers (the request target, the https
# check, 1.5.5's `jwks_url` parse error); `http` names a status as 1.5.5's client printed it. Both
# already in the graph (`http` through busbar-contract).
url = "2"
http = "1"
tracing = "0.1"
# The lent client secret is wiped when the instance drops it; already in the graph (busbar-contract).
zeroize = "1"
# `testkit` only (off by default, never in a shipped build, enabled only through dev-dependencies):
# the local issuer's certificate and its loopback HTTPS endpoint (src/testkit.rs), for a host whose
# connector dials it. A test server, never this module's own connection.
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[features]
# A LOCAL OIDC ISSUER for tests of hosts that load this module (busbar's auth-chain and stdio-serve
# proofs, this repo's own conformance and e2e tests): an ES256 key, its JWKS served over a
# certificate-verified loopback endpoint, and genuinely signed tokens. Off by default.
testkit = ["dep:rcgen", "dep:rustls"]

[dev-dependencies]
# The contract's test kit (`busbar_contract::testkit`: the warn capture the JWKS cache tests read)
# is behind the DEV-ONLY `test-seal` feature; this dev edge enables it, the normal one above never does.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767", features = ["test-seal"] }
# ring's ECDSA keygen/signing lets the tests mint real ES256 tokens + a matching JWKS fixture with no
# network — the full signature path is exercised in-process.
ring = { version = "0.17", features = ["std"] }
# The live Entra example (examples/entra_live_check.rs) drives the module's sans-IO fetches with a
# real blocking HTTPS client: an example, never the shipped image.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
