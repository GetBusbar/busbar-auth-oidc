# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-oidc"
version = "1.0.0"
publish = false            # internal workspace crate; never goes to crates.io
edition = "2021"
rust-version = "1.97"
description = "The OIDC auth module for busbar: verify an OpenID Connect JWT (JWKS signature + iss/aud/exp/nbf) and map its role/group claim to a Principal. Implements busbar_contract::auth::AuthModule. Crypto on ring (no jsonwebtoken/rsa)."
license = "Apache-2.0"

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only). Pinned by git rev to the busbar commit in
# `.busbar-ref`; a busbar build that links this crate `[patch]`es the busbar git source to its own
# tree, so ONE copy of the contract links.
busbar-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Signature verification on the workspace's existing crypto backend — NO jsonwebtoken/rsa (avoids
# RUSTSEC-2023-0071 and a second crypto stack). ring is already in the graph (rustls' backend).
ring = { workspace = true }
# base64url for the JWT segments and JWKS key material; already in the graph.
base64 = { workspace = true }
# JWKS/discovery HTTPS fetch on the SAME reqwest 0.12 major busbar already uses (rustls/ring TLS). The
# `blocking` feature reuses that major (no second HTTP stack); the auth path is synchronous.
reqwest = { workspace = true, features = ["blocking"] }
tracing = { workspace = true }
# `testkit` only (off by default, never in a shipped build): the local issuer's certificate and its
# loopback JWKS endpoint (src/testkit.rs). The same rustls 0.23 / ring stack reqwest already links.
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[features]
# A LOCAL OIDC ISSUER for tests of hosts that load this module (busbar's auth-chain and stdio-serve
# proofs, this repo's own conformance and e2e tests): an ES256 key, its JWKS served over a
# certificate-verified loopback endpoint, and genuinely signed tokens. Off by default.
testkit = ["dep:rcgen", "dep:rustls"]

[dev-dependencies]
# The contract's test kit (`busbar_contract::testkit::WarnCapture`) for the cache's warning tests: it
# is compiled only under the dev-only `test-seal` feature, which no non-dev edge enables.
busbar-contract = { workspace = true, features = ["test-seal"] }
# ring's ECDSA keygen/signing lets the tests mint real ES256 tokens + a matching JWKS fixture with no
# network — the full signature path is exercised in-process.
ring = { workspace = true, features = ["std"] }
