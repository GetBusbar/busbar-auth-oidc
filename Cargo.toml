# SPDX-License-Identifier: Apache-2.0
#
# This repo brings 100% of what it needs: the real OIDC verification logic (auth-oidc) and the thin
# dlopen ABI adapter that packages it as a busbar plugin (auth-oidc-plugin) both live here, as a
# same-repo Cargo workspace — not split across this repo and busbar.
#
# Its one busbar dependency is busbar-contract (#40: a plugin names the contract only; the plugin
# SDK is `busbar_contract::abi::sdk` since the #84 merge), plus busbar-plugin-loader dev-only for the
# conformance and e2e tests — both `git` dependencies on GetBusbar/busbar pinned to the rev in
# `.busbar-ref` field 1. No sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "auth-oidc",
    "auth-oidc-plugin",
]
