# RENDERED by `busbar-release plugin sync` from GetBusbar/busbar-release template/ and busbar's
# `.github/fleet/deps.toml` at 13595111921338a07736b79c1b3dc97d92213511; a hand edit is overwritten by the next sync. CI runs
# `cargo deny check` on it (busbar's plugin-ci.yml at the pin). The license allowlist is busbar's own;
# the one reviewed git source is busbar itself, at the pin.
[graph]
all-features = false

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# busbar .github/fleet/deps.toml [bans].deny: one stack per concern, fleet-wide.
deny = [
    { crate = "openssl", reason = "TLS is rustls (core-only); no OpenSSL anywhere in the fleet" },
    { crate = "openssl-sys", reason = "TLS is rustls (core-only); no OpenSSL anywhere in the fleet" },
    { crate = "native-tls", reason = "TLS is rustls (core-only); no platform TLS anywhere in the fleet" },
    { crate = "hyper:<1", reason = "HTTP is hyper 1; no hyper 0.14 stack" },
    { crate = "rustls:<0.23", reason = "one rustls major (0.23) fleet-wide" },
    { crate = "ring:<0.17", reason = "one ring major (0.17) fleet-wide" },
    { crate = "serde_yaml", reason = "unmaintained; busbar uses serde_yaml_ng" },
]
# busbar .github/fleet/deps.toml [bans].skip: duplicates the fleet accepts, each with its reason there.
skip = [
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/GetBusbar/busbar"]
