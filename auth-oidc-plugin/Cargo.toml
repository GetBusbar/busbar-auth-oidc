# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-oidc-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The OIDC auth module as a droppable busbar plugin: a cdylib exporting the auth kind's door. Drop it in the plugins folder, add `oidc` to auth.chain, and configure it under `identity-providers:`."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door, exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what the conformance test depends on to have the cdylib built.
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `door::door` is the door this image exports. The one busbar crate is
# busbar-contract (#40), whose `abi::sdk` carries the export macro — pinned by git rev to
# `.busbar-ref` field 1.
busbar-contract = { workspace = true }
busbar-auth-oidc = { path = "../auth-oidc" }

[dev-dependencies]
# Dev-only, same pinned busbar rev as busbar-contract (one busbar source resolves). The linked +
# dropped-in conformance test (tests/conformance.rs) signs, packs, scans and admits the built cdylib
# and the linked door through the REAL loader's door validation and dispatcher; the end-to-end test
# loads the built cdylib through the same door.
busbar-plugin-loader = { workspace = true }
# Both tests verify REAL ES256 tokens minted by the logic crate's own local issuer
# (`busbar_auth_oidc::testkit`); the conformance and dlopen tests serve its JWKS through a
# connection table playing the IdP (the plugin never dials), and the admin-API e2e has the real
# busbar's connector fetch it from the issuer's certificate-verified loopback endpoint. Dev-only:
# the testkit's TLS server never reaches the shipped closure.
busbar-auth-oidc = { path = "../auth-oidc", features = ["testkit"] }
serde_json = { workspace = true }
# The e2e decodes the login cookie (base64url JSON) the live admin install flow sets.
base64 = "0.22"
# For the real-server admin-API install + auth-chain e2e test (tests/e2e.rs's
# install_oidc_plugin_via_admin_api_and_authenticate): packs the plugin cdylib with the real
# `busbar-plugin-pack` BINARY (spawned as a subprocess, same as store-postgres/store-sqlite's own
# equivalent e2e tests — no need to link busbar-plugin-sign as a library) and drives real blocking
# HTTP against a spawned real `busbar` binary (admin API install/restart + a real bearer-token
# data-plane request).
reqwest = { workspace = true, features = ["json", "blocking"] }
