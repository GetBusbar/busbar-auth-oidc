# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-oidc-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The OIDC auth module as a droppable busbar plugin: a cdylib exporting the auth C ABI. Drop it in the plugins folder, add `oidc` to auth.chain, and configure it under `identity-providers:`."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib for the C ABI delivery; rlib so the unit tests / e2e test can exercise it as a normal crate too

[dependencies]
# busbar-auth-oidc is now a SAME-REPO sibling crate (this plugin brings 100% of what it needs — the
# real logic lives here, not in busbar). The one busbar crate is busbar-contract (#40), whose
# `abi::sdk` carries the export macro — pinned by git rev to `.busbar-ref` field 1.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "8b7b6473f47f8d37ae60839c74cfe6a9b64a1dc9" }
busbar-auth-oidc = { path = "../auth-oidc" }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
# Dev-only, same pinned busbar rev as busbar-contract (one busbar source resolves). The linked +
# dropped-in conformance test (tests/conformance.rs) signs, packs, scans and opens the built cdylib
# over the REAL loader; the end-to-end
# test loads the built cdylib over the real loader ABI seam, mints a real ES256 JWT, and serves a real
# JWKS document over a real local TLS listener, so busbar-auth-oidc's own ReqwestFetcher does a genuine
# HTTPS fetch+verify rather than a stub. Same rustls/rcgen/ring versions the monorepo pins for this
# exact test (crates/plugin-loader's dev-dependencies).
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "8b7b6473f47f8d37ae60839c74cfe6a9b64a1dc9" }
ring = "0.17"
base64 = "0.22"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# For the real-server admin-API install + auth-chain e2e test (tests/e2e.rs's
# install_oidc_plugin_via_admin_api_and_authenticate): packs the plugin cdylib with the real
# `busbar-plugin-pack` BINARY (spawned as a subprocess, same as store-postgres/store-sqlite's own
# equivalent e2e tests — no need to link busbar-plugin-sign as a library) and drives real blocking
# HTTP against a spawned real `busbar` binary (admin API install/restart + a real bearer-token
# data-plane request).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
